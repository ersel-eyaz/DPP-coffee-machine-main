[project]
name = "dpp_prototype"
version = "0.0.0"
description = "DPP Prototyp Backend mit FastAPI und Beanie"
authors = [
    { name = "Fraunhofer IPA", email = "" },
]
dependencies = [
    "fastapi[standard]==0.115.2",
    "uvicorn==0.30.1",
    "beanie==1.25.0",
    "motor==3.6.0",
    "pydantic-settings==2.5.2",
    "httpx==0.27.2",
]
requires-python = "==3.12.3"
readme = "README.md"
license = { text = "MIT" }

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.scripts]
ruff-check = { cmd = "ruff check ." }
ruff-format = { cmd = "ruff format ." }
server = { cmd = "fastapi dev src/dpp/server.py" }
init-data = { cmd = "python -m dpp.seed init" }   
clear-db  = { cmd = "python -m dpp.seed clear" }  

[tool.pdm.dev-dependencies]
dev = [
    "ruff==0.8.1",
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "mongomock-motor==0.0.34",
]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".hg",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
]
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.format]
quote-style = "double"
